name: Keep-alive ping (sparta-neetquiz-o982)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render bot every 5 min
        run: |
          echo "pinging bot..."
          curl -sS --max-time 90 -o - -w "\nHTTP %{http_code} in %{time_total}s\n" https://sparta-neetquiz-o982.onrender.com/ || true
          echo "done."
